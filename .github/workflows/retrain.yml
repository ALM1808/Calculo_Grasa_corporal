name: Retrain and Compare Model

on:
  schedule:
    # Cada domingo a las 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run training & comparison
        env:
          API_URL: https://grasa-backend-648174663015.europe-west1.run.app
        run: python backend/train_compare.py

      - name: Promote model if improves
        run: python backend/promote_model.py

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: training-metrics
          path: metrics.json
          if-no-files-found: ignore

      - name: Evaluate promotion rule
        run: python backend/evaluate_promotion.py

      - name: Upload promotion decision
        uses: actions/upload-artifact@v4
        with:
          name: promotion-decision
          path: promotion_decision.json
          if-no-files-found: ignore


      - name: Upload model artifact (if exists)
        uses: actions/upload-artifact@v4
        with:
          name: rf_pipeline_v2
          path: models/rf_pipeline_v2.pkl
          if-no-files-found: ignore

      - name: Register model in Hopsworks (if promoted)
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: python backend/register_model.py
