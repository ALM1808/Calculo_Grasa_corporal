name: Retrain and Compare Model

on:
  schedule:
    # Cada domingo a las 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run training & comparison
        env:
          API_URL: https://grasa-backend-648174663015.europe-west1.run.app
        run: |
          cd backend
          python train_compare.py

      - name: Upload model artifact (if exists)
        uses: actions/upload-artifact@v4
        with:
          name: rf_pipeline_v2
          path: models/rf_pipeline_v2.pkl
          if-no-files-found: ignore

